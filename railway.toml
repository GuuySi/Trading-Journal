[build]
builder = "NIXPACKS"
buildCommand = "npm install --prefix backend && npm install --prefix frontend && npm run build --prefix frontend && npm run build --prefix backend && cd backend && npx prisma db push --skip-generate"

[deploy]
startCommand = "node backend/dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
