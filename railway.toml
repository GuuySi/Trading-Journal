[build]
builder = "NIXPACKS"
buildCommand = "npm install --include=dev --prefix backend && npm install --include=dev --prefix frontend && npm run build --prefix frontend && npm run build --prefix backend"

[deploy]
preDeployCommand = "cd backend && npx prisma db push --skip-generate"
startCommand = "node backend/dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
